name: ci

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # Checkout Repository
      - name: Checkout
        uses: actions/checkout@v2

      # Install Tools
      - name: Install Tools
        run: |
          sudo apt-get install wget build-essential

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: "setup.py"

      - name: Install Python dependencies
        run: |
          python3 -m pip install setuptools pytest

      # Install (n)Migen / LiteX / Cores
      - name: Install LiteX
        run: |
          wget https://raw.githubusercontent.com/enjoy-digital/litex/master/litex_setup.py
          python3 litex_setup.py --clone-depth=1 init install --user

      # Install Project
      - name: Install Project
        run: python3 setup.py develop --user

      # Register Appendix (CSR snapshots and A_registers.md up to date with the gateware)
      - name: Check Register Appendix
        run: python3 doc/manual/tools/csr_doc.py dump --check && python3 doc/manual/tools/csr_doc.py generate --check

      # Test
      - name: Run Tests
        run: python3 -m pytest -v
